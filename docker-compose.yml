version: "3.9"

services:
  # ── SQL Server ──────────────────────────────────────────────────────────────
  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sms_sqlserver
    environment:
      SA_PASSWORD: "YourStrong@Pass123"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P YourStrong@Pass123 -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - sms_network

  # ── SMS API ─────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sms_api
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=StudentManagementDB;User=sa;Password=YourStrong@Pass123;TrustServerCertificate=True;
      - JwtSettings__SecretKey=SMS-Super-Secret-Key-For-JWT-256bit-2026!
      - JwtSettings__Issuer=SMS.API
      - JwtSettings__Audience=SMS.Client
      - JwtSettings__ExpiryInMinutes=60
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sms_network
    volumes:
      - ./logs:/app/logs

networks:
  sms_network:
    driver: bridge

volumes:
  sqldata:
